<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/Alert.png" />
    <!-- Required for installation and for Web Push on iOS, which only delivers
         push to an installed home-screen web app. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sibuyan Alert" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>Sibuyan Alert</title>
    <meta name="description"
        content="Accident Alert and Mapping System for Sibuyan Island. Real-time accident reporting, emergency coordination, and hazard mapping to keep communities safe." />
    <meta name="keywords"
        content="Sibuyan Island, accident alert, emergency response, accident reporting, mapping system, real-time alerts, Philippines, Romblon, disaster management" />

    <!-- Open Graph -->
    <meta property="og:title" content="Sibuyan Alert - Accident Alert &amp; Mapping System" />
    <meta property="og:description"
        content="Accident Alert and Mapping System for Sibuyan Island - Real-time emergency response and coordination" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_PH" />

    <!-- Fonts: self-hosted via @fontsource (Inter + Outfit) imported in index.css.
         Google Fonts removed to eliminate 2-hop external RTT on every cold load. -->

    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <!-- Remove the retired theme preference before paint so existing users return to light mode. -->
    <script>
        (function () {
            var root = document.documentElement;
            try { localStorage.removeItem('sibuyan-alert-theme'); } catch (error) { /* storage unavailable */ }
            root.classList.remove('dark');
            delete root.dataset.theme;
            root.style.colorScheme = 'light';
        })();
    </script>
</head>

<body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
